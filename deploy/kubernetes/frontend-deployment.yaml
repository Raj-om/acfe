apiVersion: apps/v1
kind: Deployment
metadata:
  name: acfe-frontend
  namespace: acfe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acfe-frontend
  template:
    metadata:
      labels:
        app: acfe-frontend
    spec:
      containers:
      - name: acfe-frontend
        image: acfe-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
